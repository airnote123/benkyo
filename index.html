<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Supabase連携管理画面</title>
    <!-- Supabase JS SDK CDN -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 600px;
            margin: 20px auto;
            padding: 0 10px;
        }
        .container {
            border: 1px solid #ccc;
            padding: 20px;
            border-radius: 8px;
        }
        input, button {
            padding: 10px;
            margin: 5px 0;
            width: 100%;
            box-sizing: border-box;
        }
        button {
            background-color: #3ecf8e;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-weight: bold;
        }
        button:hover {
            background-color: #2eaf72;
        }
        ul {
            padding-left: 20px;
        }
    </style>
</head>
<body>

<div class="container">
    <h2>Supabase 連携データ管理</h2>

    <!-- データ入力フォーム -->
    <div>
        <input type="text" id="inputText" placeholder="登録するテキストを入力">
        <button onclick="addData()">データを保存</button>
    </div>

    <hr>

    <!-- データ一覧表示 -->
    <h3>データ一覧</h3>
    <button onclick="fetchData()">最新データを取得</button>
    <ul id="dataList"></ul>
</div>

<script>
    // 1. Supabaseの接続設定（ご自身のキーに置き換えてください）
    const SUPABASE_URL = 'YOUR_SUPABASE_URL';
    const SUPABASE_ANON_KEY = 'YOUR_SUPABASE_ANON_KEY';
    
    // Supabaseクライアントの初期化
    const supabase = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    // 2. データを取得して画面に表示する関数
    async function fetchData() {
        const listElement = document.getElementById('dataList');
        listElement.innerHTML = '読み込み中...';

        // 'your_table_name' を実際のテーブル名に変更してください
        const { data, error } = await supabase
            .from('your_table_name')
            .select('*');

        if (error) {
            console.error('取得エラー:', error);
            listElement.innerHTML = '<li>データの取得に失敗しました</li>';
            return;
        }

        listElement.innerHTML = '';
        data.forEach(item => {
            const li = document.createElement('li');
            // 'content' 部分を表示したいカラム名に変更してください
            li.textContent = item.content || JSON.stringify(item);
            listElement.appendChild(li);
        });
    }

    // 3. データを挿入する関数
    async function addData() {
        const input = document.getElementById('inputText');
        const text = input.value.trim();

        if (!text) {
            alert('テキストを入力してください');
            return;
        }

        // 'your_table_name' と 'content' を実際のテーブル名・カラム名に変更してください
        const { data, error } = await supabase
            .from('your_table_name')
            .insert([{ content: text }]);

        if (error) {
            console.error('挿入エラー:', error);
            alert('保存に失敗しました');
        } else {
            input.value = '';
            fetchData(); // 送信後に一覧を更新
        }
    }

    // ページ読み込み時に自動でデータを取得
    window.onload = fetchData;
</script>

</body>
</html>
