<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>過去問スキャン・自動登録パイプライン</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen p-6 font-sans">
  <div class="max-w-2xl mx-auto space-y-6">
    <header class="border-b border-slate-700 pb-4">
      <h1 class="text-xl font-bold text-emerald-400">過去問スキャン・自動登録パイプライン</h1>
      <p class="text-xs text-slate-400 mt-1">1枚（A4）なら単体保存、2枚（P1/P2）なら自動結合してSupabaseへ登録します</p>
    </header>

    <main class="space-y-4">
      <div id="drop-zone" class="border-2 border-dashed border-slate-600 hover:border-emerald-500 rounded-xl p-8 text-center bg-slate-800/50 cursor-pointer transition-colors">
        <input type="file" id="file-input" accept="image/*,.pdf" multiple class="hidden">
        <div class="space-y-2">
          <svg class="w-10 h-10 mx-auto text-slate-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M7 16a4 4 0 01-.88-7.903A5 5 0 1115.9 6L16 6a5 5 0 011 9.9M15 13l-3-3m0 0l-3 3m3-3v12"></path></svg>
          <p class="text-sm font-medium">ファイルを選択（スキャンPDFまたは画像1〜2枚）</p>
          <p class="text-xs text-slate-500">タップして「ファイル」アプリから選択</p>
        </div>
      </div>

      <!-- ログ表示カード -->
      <div id="status-card" class="hidden bg-slate-800 rounded-xl p-4 border border-slate-700 space-y-3">
        <div class="flex items-center justify-between">
          <span id="status-title" class="text-sm font-bold text-slate-200">処理中...</span>
          <span id="status-spinner" class="animate-spin text-emerald-400">🌀</span>
        </div>
        <div class="w-full bg-slate-700 h-2 rounded-full overflow-hidden">
          <div id="progress-bar" class="bg-emerald-500 h-full w-0 transition-all duration-300"></div>
        </div>
        <p id="status-log" class="text-xs font-mono text-slate-400 whitespace-pre-line"></p>
      </div>
    </main>
  </div>

  <script>
    // --- 1. Supabase 設定 ---
    const SUPABASE_URL = 'YOUR_SUPABASE_URL';
    const SUPABASE_KEY = 'YOUR_SUPABASE_ANON_KEY';
    const supabase = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';

    const fileInput = document.getElementById('file-input');
    const dropZone = document.getElementById('drop-zone');
    const statusCard = document.getElementById('status-card');
    const statusTitle = document.getElementById('status-title');
    const statusLog = document.getElementById('status-log');
    const progressBar = document.getElementById('progress-bar');
    const statusSpinner = document.getElementById('status-spinner');

    dropZone.addEventListener('click', () => fileInput.click());
    fileInput.addEventListener('change', (e) => handleFiles(Array.from(e.target.files)));

    // --- 2. メインパイプライン ---
    async function handleFiles(files) {
      if (files.length === 0) return;
      resetStatus();
      showStatus('ファイル読み込み中...', 10, 'ファイルを受領しました');

      try {
        let rawImages = [];

        // PDF解体 または 画像読み込み
        if (files.length === 1 && files[0].type === 'application/pdf') {
          log('PDFファイルを検知。各ページを取り出し中...');
          rawImages = await extractImagesFromPdf(files[0]);
        } else {
          log('画像ファイルを検知。読み込み中...');
          rawImages = await Promise.all(files.map(loadImageFile));
        }

        if (rawImages.length === 0 || rawImages.length > 2) {
          throw new Error('処理できるのは1枚（A4単体）または2枚（見開きペア）です。');
        }

        showStatus('QRコード解析中（別スキャン処理）...', 30, '専用の読み取りキャンバスで解析しています');

        // 【改善】QR解析を独立して実行し、回転補正済みの高画質画像とメタデータを取得
        const processedPages = await Promise.all(rawImages.map(parseAndOrientImage));

        let finalBlob = null;
        let meta = {};

        if (processedPages.length === 1) {
          // --- 1枚物（A4単体）処理 ---
          const single = processedPages[0];
          meta = single.meta;
          log(`1枚構成を検知: 【${meta.school}】${meta.year}年 ${meta.subject} (生徒ID: ${meta.student_id})`);
          showStatus('画像変換中...', 60, '単体保存の準備をしています');
          finalBlob = await imageToBlob(single.img);

        } else if (processedPages.length === 2) {
          // --- 2枚物（見開きA3/B4結合）処理 ---
          const p1 = processedPages.find(p => p.meta.page === 'P1');
          const p2 = processedPages.find(p => p.meta.page === 'P2');

          if (!p1 || !p2) {
            throw new Error('P1（左）とP2（右）のペアを識別できませんでした。QRの内容を確認してください。');
          }

          meta = p1.meta; // 共通メタデータ
          log(`2枚（見開き）構成を検知: 【${meta.school}】${meta.year}年 ${meta.subject}`);
          showStatus('画像を横結合中...', 60, 'P1（左）とP2（右）を合体しています');
          finalBlob = await createCombinedBlob(p1.img, p2.img);
        }

        showStatus('Supabaseへ登録中...', 85, 'Storageへの送信とDB更新を行っています');

        // Supabaseへ保存
        const timestamp = Date.now();
        const filePath = `${meta.school}/${meta.year}/${meta.subject}/${meta.student_id}_${timestamp}.png`;

        const { error: storageError } = await supabase.storage
          .from('answers')
          .upload(filePath, finalBlob, { contentType: 'image/png' });

        if (storageError) throw storageError;

        const { data: urlData } = supabase.storage.from('answers').getPublicUrl(filePath);

        const { error: dbError } = await supabase.from('answers').insert({
          school: meta.school,
          year: parseInt(meta.year),
          subject: meta.subject,
          student_id: meta.student_id,
          image_url: urlData.publicUrl,
          status: 'ungraded'
        });

        if (dbError) throw dbError;

        showStatus('完了しました！', 100, `登録が完了しました。\n保存先: ${filePath}\n採点システムへ自動連携されます。`, false);

      } catch (err) {
        console.error(err);
        showStatus('エラーが発生しました', 0, `[ERROR] ${err.message}`, false, true);
      } finally {
        fileInput.value = '';
      }
    }

    // --- 3. QRコード独立解析（コア改善部分） ---
    async function parseAndOrientImage(img) {
      // 1. QR検出専用の別Canvasを作成（高画質画像のまま検出すると重いため適正サイズに調整して読取り）
      const scanCanvas = document.createElement('canvas');
      const scanCtx = scanCanvas.getContext('2d');
      
      // 解析用には長辺最大1500px程度にリサイズして高速化・認識率向上
      const maxDim = 1500;
      let scale = 1.0;
      if (Math.max(img.width, img.height) > maxDim) {
        scale = maxDim / Math.max(img.width, img.height);
      }
      scanCanvas.width = img.width * scale;
      scanCanvas.height = img.height * scale;
      scanCtx.drawImage(img, 0, 0, scanCanvas.width, scanCanvas.height);

      let imageData = scanCtx.getImageData(0, 0, scanCanvas.width, scanCanvas.height);
      let code = jsQR(imageData.data, imageData.width, imageData.height);

      let rotationNeeded = 0; // 0度または180度

      // 読めなかった場合、180度回転して再チェック
      if (!code) {
        scanCtx.clearRect(0, 0, scanCanvas.width, scanCanvas.height);
        scanCtx.translate(scanCanvas.width, scanCanvas.height);
        scanCtx.rotate(Math.PI);
        scanCtx.drawImage(img, 0, 0, scanCanvas.width, scanCanvas.height);
        imageData = scanCtx.getImageData(0, 0, scanCanvas.width, scanCanvas.height);
        code = jsQR(imageData.data, imageData.width, imageData.height);
        if (code) {
          rotationNeeded = 180;
        }
      }

      if (!code) {
        throw new Error('QRコードが検出できませんでした。印刷が不鮮明か、向きが斜めすぎる可能性があります。');
      }

      // QRデータパース
      let meta = {};
      try {
        meta = JSON.parse(code.data);
      } catch (e) {
        throw new Error(`QRデータの形式が不正です (JSON形式である必要があります): ${code.data}`);
      }

      // 2. 元の「高画質画像」側を正しい向きに回転補正して出力
      const outCanvas = document.createElement('canvas');
      const outCtx = outCanvas.getContext('2d');
      outCanvas.width = img.width;
      outCanvas.height = img.height;

      if (rotationNeeded === 180) {
        outCtx.translate(img.width, img.height);
        outCtx.rotate(Math.PI);
      }
      outCtx.drawImage(img, 0, 0);

      const orientedImg = new Image();
      orientedImg.src = outCanvas.toDataURL('image/png');
      await new Promise(r => orientedImg.onload = r);

      return { img: orientedImg, meta: meta };
    }

    // --- 4. 画像変換ユーティリティ ---
    function imageToBlob(img) {
      return new Promise((resolve) => {
        const canvas = document.createElement('canvas');
        canvas.width = img.width;
        canvas.height = img.height;
        const ctx = canvas.getContext('2d');
        ctx.drawImage(img, 0, 0);
        canvas.toBlob((blob) => resolve(blob), 'image/png');
      });
    }

    function createCombinedBlob(imgP1, imgP2) {
      return new Promise((resolve) => {
        const canvas = document.createElement('canvas');
        canvas.width = imgP1.width + imgP2.width;
        canvas.height = Math.max(imgP1.height, imgP2.height);

        const ctx = canvas.getContext('2d');
        ctx.fillStyle = '#FFFFFF';
        ctx.fillRect(0, 0, canvas.width, canvas.height);

        // 左にP1、右にP2を描画
        ctx.drawImage(imgP1, 0, 0);
        ctx.drawImage(imgP2, imgP1.width, 0);

        canvas.toBlob((blob) => resolve(blob), 'image/png');
      });
    }

    async function extractImagesFromPdf(file) {
      const arrayBuffer = await file.arrayBuffer();
      const pdf = await pdfjsLib.getDocument({ data: arrayBuffer }).promise;
      const images = [];

      for (let i = 1; i <= Math.min(2, pdf.numPages); i++) {
        const page = await pdf.getPage(i);
        const viewport = page.getViewport({ scale: 2.0 });
        const canvas = document.createElement('canvas');
        const ctx = canvas.getContext('2d');
        canvas.width = viewport.width;
        canvas.height = viewport.height;

        await page.render({ canvasContext: ctx, viewport: viewport }).promise;
        
        const img = new Image();
        img.src = canvas.toDataURL('image/png');
        await new Promise(r => img.onload = r);
        images.push(img);
      }
      return images;
    }

    function loadImageFile(file) {
      return new Promise((resolve, reject) => {
        const img = new Image();
        img.onload = () => resolve(img);
        img.onerror = reject;
        img.src = URL.createObjectURL(file);
      });
    }

    function resetStatus() {
      statusLog.textContent = '';
      statusCard.classList.add('hidden');
    }

    function showStatus(title, percent, logText, isSpinning = true, isError = false) {
      statusCard.classList.remove('hidden');
      statusTitle.textContent = title;
      statusTitle.className = `text-sm font-bold ${isError ? 'text-rose-400' : 'text-slate-200'}`;
      progressBar.style.width = `${percent}%`;
      progressBar.className = `h-full transition-all duration-300 ${isError ? 'bg-rose-500' : 'bg-emerald-500'}`;
      statusSpinner.style.display = isSpinning ? 'inline-block' : 'none';
      if (logText) log(logText);
    }

    function log(text) {
      statusLog.textContent += `${text}\n`;
    }
  </script>
</body>
</html>
