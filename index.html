<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>過去問自動結合・登録パイプライン</title>
  <!-- Tailwind CSS (UI用) -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Supabase JS Client -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <!-- jsQR (QRコード解析) -->
  <script src="https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.min.js"></script>
  <!-- pdf.js (PDF解体用) -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen p-6 font-sans">
  <div class="max-w-2xl mx-auto space-y-6">
    <header class="border-b border-slate-700 pb-4">
      <h1 class="text-xl font-bold text-emerald-400">過去問スキャン・半自動インポート</h1>
      <p class="text-xs text-slate-400 mt-1">Epsonスキャンデータ（PDF/画像2枚）を自動結合してSupabaseへ登録します</p>
    </header>

    <!-- ファイル選択エリア -->
    <main class="space-y-4">
      <div id="drop-zone" class="border-2 border-dashed border-slate-600 hover:border-emerald-500 rounded-xl p-8 text-center bg-slate-800/50 cursor-pointer transition-colors">
        <input type="file" id="file-input" accept="image/*,.pdf" multiple class="hidden">
        <div class="space-y-2">
          <svg class="w-10 h-10 mx-auto text-slate-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M7 16a4 4 0 01-.88-7.903A5 5 0 1115.9 6L16 6a5 5 0 011 9.9M15 13l-3-3m0 0l-3 3m3-3v12"></path></svg>
          <p class="text-sm font-medium">ファイルを選択（スキャンPDFまたは画像2枚）</p>
          <p class="text-xs text-slate-500">タップして「ファイル」アプリから選択</p>
        </div>
      </div>

      <!-- ステータス表示表示ログ -->
      <div id="status-card" class="hidden bg-slate-800 rounded-xl p-4 border border-slate-700 space-y-3">
        <div class="flex items-center justify-between">
          <span id="status-title" class="text-sm font-bold text-slate-200">処理中...</span>
          <span id="status-spinner" class="animate-spin text-emerald-400">🌀</span>
        </div>
        <div class="w-full bg-slate-700 h-2 rounded-full overflow-hidden">
          <div id="progress-bar" class="bg-emerald-500 h-full w-0 transition-all duration-300"></div>
        </div>
        <p id="status-log" class="text-xs font-mono text-slate-400 whitespace-pre-line"></p>
      </div>

      <!--プレビューキャンバス (非表示・内部計算用) -->
      <canvas id="work-canvas" class="hidden"></canvas>
    </main>
  </div>

  <script>
    // --- 1. Supabase 設定 ---
    const SUPABASE_URL = 'YOUR_SUPABASE_URL'; // ご自身の環境に合わせて打ち替えてください
    const SUPABASE_KEY = 'YOUR_SUPABASE_ANON_KEY';
    const supabase = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    // PDF.js worker 設定
    pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';

    const fileInput = document.getElementById('file-input');
    const dropZone = document.getElementById('drop-zone');
    const statusCard = document.getElementById('status-card');
    const statusTitle = document.getElementById('status-title');
    const statusLog = document.getElementById('status-log');
    const progressBar = document.getElementById('progress-bar');
    const statusSpinner = document.getElementById('status-spinner');

    dropZone.addEventListener('click', () => fileInput.click());
    fileInput.addEventListener('change', (e) => handleFiles(Array.from(e.target.files)));

    // --- 2. メイン処理パイプライン ---
    async function handleFiles(files) {
      if (files.length === 0) return;

      showStatus('ファイル読み込み中...', 10, '入力を受付しました');

      try {
        let imageElements = [];

        // PDFか画像かで分岐処理
        if (files.length === 1 && files[0].type === 'application/pdf') {
          log('PDFファイルを検知。各ページを画像に解体中...');
          imageElements = await extractImagesFromPdf(files[0]);
        } else {
          log('画像ファイルを検知。読み込み中...');
          imageElements = await Promise.all(files.map(loadImageFile));
        }

        if (imageElements.length !== 2) {
          throw new Error(`画像が2枚必要ですが、${imageElements.length}コマ検出されました。見開き左右（P1/P2）になるように指定してください。`);
        }

        showStatus('QRコード解析中...', 30, '左右ページおよびメタデータを読み取っています');

        // QR解析と向き補正
        const parsedPages = await Promise.all(imageElements.map(parseAndOrientImage));

        const p1 = parsedPages.find(p => p.meta.page === 'P1');
        const p2 = parsedPages.find(p => p.meta.page === 'P2');

        if (!p1 || !p2) {
          throw new Error('P1（左）とP2（右）のQRコードのペアを認識できませんでした。QRが途切れていないか確認してください。');
        }

        log(`解析成功: 【${p1.meta.school}】${p1.meta.year}年 ${p1.meta.subject} (生徒ID: ${p1.meta.student_id})`);
        showStatus('画像を横結合中...', 60, 'A4 2枚を A3/B4 結合画像へ整形しています');

        // Canvas合成 (A4 x 2 -> B4/A3)
        const combinedBlob = await createCombinedBlob(p1.img, p2.img);

        showStatus('Supabaseへ登録中...', 85, 'StorageへのアップロードとDBのインサートを行っています');

        // Supabaseへ送信
        const meta = p1.meta;
        const timestamp = Date.now();
        const filePath = `${meta.school}/${meta.year}/${meta.subject}/${meta.student_id}_${timestamp}.png`;

        // ① Storage Upload
        const { data: storageData, error: storageError } = await supabase.storage
          .from('answers')
          .upload(filePath, combinedBlob, { contentType: 'image/png' });

        if (storageError) throw storageError;

        // ② Public URL 取得
        const { data: urlData } = supabase.storage.from('answers').getPublicUrl(filePath);

        // ③ DB Insert
        const { error: dbError } = await supabase.from('answers').insert({
          school: meta.school,
          year: parseInt(meta.year),
          subject: meta.subject,
          student_id: meta.student_id,
          image_url: urlData.publicUrl,
          status: 'ungraded'
        });

        if (dbError) throw dbError;

        showStatus('完了しました！', 100, `登録が正常完了しました。\nStorageパス: ${filePath}\n採点システムへ即時反映されます。`, false);

      } catch (err) {
        console.error(err);
        showStatus('エラーが発生しました', 0, `[ERROR] ${err.message}`, false, true);
      } finally {
        fileInput.value = '';
      }
    }

    // --- 3. 補助関数群 ---

    // PDF ➔ Image 化 (PDF.js)
    async function extractImagesFromPdf(file) {
      const arrayBuffer = await file.arrayBuffer();
      const pdf = await pdfjsLib.getDocument({ data: arrayBuffer }).promise;
      const images = [];

      for (let i = 1; i <= Math.min(2, pdf.numPages); i++) {
        const page = await pdf.getPage(i);
        const viewport = page.getViewport({ scale: 2.0 }); // 高画質スキャン用にスケール2倍
        const canvas = document.createElement('canvas');
        const ctx = canvas.getContext('2d');
        canvas.width = viewport.width;
        canvas.height = viewport.height;

        await page.render({ canvasContext: ctx, viewport: viewport }).promise;
        
        const img = new Image();
        img.src = canvas.toDataURL('image/png');
        await new Promise(r => img.onload = r);
        images.push(img);
      }
      return images;
    }

    function loadImageFile(file) {
      return new Promise((resolve, reject) => {
        const img = new Image();
        img.onload = () => resolve(img);
        img.onerror = reject;
        img.src = URL.createObjectURL(file);
      });
    }

    // QRの解析および180度回転自動補正
    async function parseAndOrientImage(img) {
      const canvas = document.createElement('canvas');
      const ctx = canvas.getContext('2d');
      canvas.width = img.width;
      canvas.height = img.height;
      ctx.drawImage(img, 0, 0);

      let imageData = ctx.getImageData(0, 0, canvas.width, canvas.height);
      let code = jsQR(imageData.data, imageData.width, imageData.height);

      // 正位置で見つからなかった場合、180度回転させて再判定
      let isRotated = false;
      if (!code) {
        ctx.translate(canvas.width, canvas.height);
        ctx.rotate(Math.PI);
        ctx.drawImage(img, 0, 0);
        imageData = ctx.getImageData(0, 0, canvas.width, canvas.height);
        code = jsQR(imageData.data, imageData.width, imageData.height);
        isRotated = true;
      }

      if (!code) {
        throw new Error('画像からQRコードが読み取れませんでした。');
      }

      // QRの中身(JSON)をパース
      // 例: {"school":"kaisei","year":2024,"subject":"math","student_id":"S123","page":"P1"}
      let meta = {};
      try {
        meta = JSON.parse(code.data);
      } catch (e) {
        throw new Error(`QRコードのデータフォーマットが不正です: ${code.data}`);
      }

      // 補正済みImgを作成
      const finalImg = new Image();
      finalImg.src = canvas.toDataURL('image/png');
      await new Promise(r => finalImg.onload = r);

      return { img: finalImg, meta: meta };
    }

    // P1とP2をCanvasで横に結合 (A4x2 -> A3/B4)
    function createCombinedBlob(imgP1, imgP2) {
      return new Promise((resolve) => {
        const canvas = document.createElement('canvas');
        canvas.width = imgP1.width + imgP2.width;
        canvas.height = Math.max(imgP1.height, imgP2.height);

        const ctx = canvas.getContext('2d');
        // 背景を白で塗る
        ctx.fillStyle = '#FFFFFF';
        ctx.fillRect(0, 0, canvas.width, canvas.height);

        // 左にP1、右にP2を描画
        ctx.drawImage(imgP1, 0, 0);
        ctx.drawImage(imgP2, imgP1.width, 0);

        canvas.toBlob((blob) => resolve(blob), 'image/png');
      });
    }

    // UI更新補助
    function showStatus(title, percent, logText, isSpinning = true, isError = false) {
      statusCard.classList.remove('hidden');
      statusTitle.textContent = title;
      statusTitle.className = `text-sm font-bold ${isError ? 'text-rose-400' : 'text-slate-200'}`;
      progressBar.style.width = `${percent}%`;
      progressBar.className = `h-full transition-all duration-300 ${isError ? 'bg-rose-500' : 'bg-emerald-500'}`;
      statusSpinner.style.display = isSpinning ? 'inline-block' : 'none';
      if (logText) log(logText);
    }

    function log(text) {
      statusLog.textContent += `${text}\n`;
    }
  </script>
</body>
</html>
